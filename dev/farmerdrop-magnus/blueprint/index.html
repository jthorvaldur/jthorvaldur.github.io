<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#084d2e" />
    <title>Member blueprint · FarmerDrop</title>
    <link rel="icon" href="../media/logo-only.webp" />
    <link rel="stylesheet" href="blueprint.css" />
    <script src="catalog.js" defer></script>
    <script src="blueprint.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main-content">Skip to content</a>
    <aside class="bench" aria-label="Prototype controls">
      <span>Design preview <span class="sample">· Sample data</span></span>
      <div>
        <label for="scenario">Member state</label
        ><select id="scenario">
          <option value="new">New member</option>
          <option value="incomplete">Incomplete profile</option>
          <option value="guest">Guest browsing</option>
          <option value="verify">Verify email</option>
          <option value="nearby">No nearby matches</option>
          <option value="pending">Awaiting approval</option>
          <option value="returning">Approved member</option>
          <option value="closed">No open pickup</option></select
        ><label for="version">Layout</label
        ><select aria-label="Home and picker layout comparison" id="version">
          <option value="proposed">Proposed</option>
          <option value="current">Current model</option></select
        ><button id="open-index" type="button">Page index</button>
      </div>
    </aside>
    <header class="mast">
      <div class="mast-inner">
        <a href="#home" data-to="home" class="logo" aria-label="FarmerDrop member home"
          ><img src="../media/logo-text.webp" width="1600" height="520" alt="FarmerDrop"
        /></a>
        <nav aria-label="Member navigation">
          <a href="#home" data-to="home">Home</a><a href="#shop" data-to="shop">Shop</a
          ><a href="#orders" data-to="orders">Orders</a><a href="#account" data-to="account">Account</a>
        </nav>
      </div>
    </header>
    <main id="main-content" tabindex="-1"></main>
    <footer>
      <div>
        <span>FarmerDrop</span>
        <nav aria-label="Member help">
          <a href="#help" data-to="help">How ordering works</a
          ><a href="#support" data-to="support">Support</a>
        </nav>
      </div>
    </footer>
    <dialog id="directory" aria-labelledby="index-title">
      <div class="index-head">
        <div>
          <p class="kicker">Design review</p>
          <h2 id="index-title">Page index</h2>
        </div>
        <button id="close-index" type="button">Close</button>
      </div>
      <div class="index-filters">
        <label>Find a page<input type="search" id="query" placeholder="Search page names" /></label
        ><label
          >Area<select id="area">
            <option value="">All areas</option>
          </select></label
        >
      </div>
      <p id="result-count" aria-live="polite"></p>
      <div id="results"></div>
    </dialog>
    <noscript
      ><p>
        This interactive preview needs JavaScript to show the sample member journeys and page index.
      </p></noscript
    >
  </body>
</html>
