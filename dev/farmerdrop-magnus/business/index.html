<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173d2c">
  <meta name="referrer" content="no-referrer">
  <title>Business view · FarmerDrop</title>
  <link rel="icon" href="../media/logo-only.webp" type="image/webp">
  <link rel="stylesheet" href="business.css">
  <script type="module" src="business.js"></script>
</head>
<body>
  <a class="skip" href="#worklist">Skip to worklist</a>
  <header class="brandbar">
    <img src="../media/logo-text.webp" alt="FarmerDrop" width="1600" height="520">
    <button id="mode-switch" type="button" role="switch" aria-checked="true" title="Return to the website">Business view <span class="switch-track" aria-hidden="true"></span></button>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Workspace and queues">
      <label class="control-label" for="workspace">Workspace</label>
      <select id="workspace">
        <option value="farmer">Farmer</option>
        <option value="host">HostDrop</option>
      </select>
      <nav id="queue-nav" aria-label="Work queues"></nav>
    </aside>

    <main id="worklist" tabindex="-1">
      <noscript><p>Turn on JavaScript to use the sample worklist, or <a href="../index.html?view=website">return to the website</a>.</p></noscript>
      <header class="workspace-header">
        <div><h1 id="title">Business view</h1><p id="business-name"></p></div>
        <div class="date-control"><label class="control-label" for="drop-date">DropDate</label><select id="drop-date"></select></div>
      </header>

      <section class="work-surface" aria-labelledby="title">
        <div class="toolbar">
          <div class="filter-group" role="group" aria-label="Worklist filter">
            <button id="pending" type="button" aria-pressed="true">Needs action <span class="count"></span></button>
            <button id="all" type="button" aria-pressed="false">All <span class="count"></span></button>
          </div>
          <label class="search"><span class="sr">Search worklist</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="6.3"/><path d="m15 15 5 5"/></svg>
            <input id="search" type="search" autocomplete="off" placeholder="Search orders or contents">
          </label>
        </div>

        <div class="action-line">
          <p id="selection-hint"></p>
          <button type="button" id="advance" class="primary" disabled>Complete packing</button>
        </div>
        <div class="table-frame">
          <table>
            <caption id="caption" class="sr">Worklist</caption>
            <thead><tr>
              <th scope="col" class="check-col"><label id="select-header" for="select-all"><input id="select-all" type="checkbox" aria-label="Select all actionable rows shown"><span class="mobile-caption">Select all</span></label><span id="choose-one" class="mobile-caption" hidden>Choose one order</span></th>
              <th scope="col">Reference</th><th scope="col" id="primary-col">Contents</th>
              <th scope="col" id="qty-col">Quantity</th><th scope="col">Status</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <p class="empty" id="empty" hidden></p>
        </div>
        <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>
      <footer>Sample data <span aria-hidden="true">·</span> Changes stay in this tab</footer>
    </main>
  </div>
</body>
</html>
