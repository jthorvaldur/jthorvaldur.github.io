<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#163d2d">
    <title>FarmerDrop design preview</title>
    <link rel="icon" href="media/logo-only.webp" type="image/webp">
    <link rel="stylesheet" href="review.css">
    <script src="review.js" defer></script>
  </head>
  <body>
    <header class="review-bar">
      <div class="review-heading">
        <div>
          <h1>FarmerDrop preview</h1>
          <div class="review-summary" id="review-summary">Original site · Auto</div>
        </div>
        <button class="review-disclosure" type="button" aria-expanded="false" aria-controls="review-controls">
          Compare
          <svg aria-hidden="true" width="14" height="14" fill="none" viewBox="0 0 16 16"><path d="m3 6 5 5 5-5" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </div>
      <div id="review-controls" class="review-controls">
        <div class="review-options" role="group" aria-label="Design">
          <button type="button" data-design="original" aria-pressed="true">Original site</button>
          <button type="button" data-design="orchard" aria-pressed="false">Orchard</button>
          <button type="button" data-design="field" aria-pressed="false">Field</button>
        </div>
        <div class="review-options" role="group" aria-label="Viewport">
          <button type="button" data-device="auto" aria-pressed="true">Auto</button>
          <button type="button" data-device="laptop" aria-pressed="false">Laptop</button>
          <button type="button" data-device="phone" aria-pressed="false">Phone</button>
        </div>
        <a class="review-open" href="base/index.html" target="_blank" rel="noopener">
          Open design
          <svg aria-hidden="true" width="14" height="14" fill="none" viewBox="0 0 16 16"><path d="M4 12 12 4m-7 0h7v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="review-sr"> in a new tab</span>
        </a>
      </div>
    </header>
    <main class="review-stage" aria-label="Design preview" data-device="auto">
      <div class="review-frame-size">
        <iframe class="review-frame" title="Original site preview"></iframe>
      </div>
      <noscript><p><a href="base/index.html">Open the original FarmerDrop site</a> or <a href="facelift.html">open Orchard</a>.</p></noscript>
    </main>
  </body>
</html>
